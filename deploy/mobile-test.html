<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>移动端诊断 - 杜杜的小巴士</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      padding: 20px;
      background: #f5f5f5;
      font-size: 14px;
      line-height: 1.6;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 20px;
      margin-bottom: 16px;
      color: #333;
    }
    h2 {
      font-size: 16px;
      margin: 12px 0 8px;
      color: #666;
    }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      margin: 4px 0;
      font-size: 13px;
    }
    .success {
      background: #d4edda;
      color: #155724;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
    }
    .info {
      background: #d1ecf1;
      color: #0c5460;
    }
    button {
      background: #C9B1D0;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 12px;
    }
    button:active {
      opacity: 0.8;
    }
    #log {
      max-height: 300px;
      overflow-y: auto;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔍 移动端白屏诊断</h1>
    <div id="deviceInfo"></div>
  </div>

  <div class="card">
    <h2>资源加载测试</h2>
    <div id="resourceStatus"></div>
    <button onclick="testResources()">重新测试</button>
  </div>

  <div class="card">
    <h2>JavaScript 执行日志</h2>
    <div id="log"></div>
  </div>

  <div class="card">
    <button onclick="window.location.href='index.html'" style="background: #A8D5BA;">
      ✅ 测试完成，返回主页
    </button>
  </div>

  <script>
    const log = (msg, type = 'info') => {
      const el = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
      el.innerHTML += `[${time}] ${prefix} ${msg}\n`;
      el.scrollTop = el.scrollHeight;
      console.log(msg);
    };

    const testResources = async () => {
      const status = document.getElementById('resourceStatus');
      status.innerHTML = '<div class="status info">⏳ 测试中...</div>';

      const resources = [
        'feishu_data/dashboard_data.js',
        'feishu_data/extra_data.js',
        'feishu_data/douban_data.js',
        'cloud-sync.js'
      ];

      let html = '';
      for (const url of resources) {
        try {
          log(`测试资源: ${url}`);
          const start = Date.now();
          const response = await fetch(url + '?t=' + Date.now());
          const time = Date.now() - start;

          if (response.ok) {
            const size = response.headers.get('content-length');
            html += `<div class="status success">✅ ${url}<br>状态: ${response.status} | 耗时: ${time}ms | 大小: ${size ? (size/1024).toFixed(1)+'KB' : '未知'}</div>`;
            log(`✅ ${url} 加载成功 (${time}ms)`, 'success');
          } else {
            html += `<div class="status error">❌ ${url}<br>HTTP ${response.status}</div>`;
            log(`❌ ${url} 失败: ${response.status}`, 'error');
          }
        } catch (err) {
          html += `<div class="status error">❌ ${url}<br>${err.message}</div>`;
          log(`❌ ${url} 错误: ${err.message}`, 'error');
        }
      }

      status.innerHTML = html;
    };

    // 显示设备信息
    const showDeviceInfo = () => {
      const info = document.getElementById('deviceInfo');
      const ua = navigator.userAgent;
      const isMobile = /Mobile|Android|iPhone|iPad/i.test(ua);

      info.innerHTML = `
        <h2>设备信息</h2>
        <div class="status ${isMobile ? 'success' : 'info'}">
          📱 设备类型: ${isMobile ? '移动设备' : '桌面设备'}
        </div>
        <div class="status info">
          📐 屏幕尺寸: ${window.innerWidth} × ${window.innerHeight}
        </div>
        <div class="status info">
          🌐 User-Agent: ${ua}
        </div>
        <div class="status info">
          ⚡ 在线状态: ${navigator.onLine ? '在线' : '离线'}
        </div>
      `;

      log('设备信息加载完成');
    };

    // 监听错误
    window.addEventListener('error', (e) => {
      log(`全局错误: ${e.message} (${e.filename}:${e.lineno})`, 'error');
    });

    window.addEventListener('unhandledrejection', (e) => {
      log(`未处理的Promise拒绝: ${e.reason}`, 'error');
    });

    // 页面加载完成
    log('诊断页面已加载');
    showDeviceInfo();
    setTimeout(testResources, 100);
  </script>
</body>
</html>
